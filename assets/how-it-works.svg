<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="How Grey works"><style>
.bg{fill:#fbf7f0}.ink{fill:#1f2a44}.ink2{fill:#5b6478}.muted{fill:#8a91a0}.line{stroke:#e3ddd2}.card{fill:#ffffff;stroke:#e8e1d5}
.acc{fill:#d8322e}.accs{stroke:#d8322e}.bar{fill:#c9ccd3}.bub{fill:#ffffff;stroke:#e3ddd2}.wave{fill:#d8322e}
@media (prefers-color-scheme: dark){.bg{fill:#14171d}.ink{fill:#eef1f6}.ink2{fill:#b3bac7}.muted{fill:#8790a0}.line{stroke:#2c313b}
.card{fill:#1c2028;stroke:#2c313b}.acc{fill:#ff5a4f}.accs{stroke:#ff5a4f}.bar{fill:#4a505c}.bub{fill:#1f242d;stroke:#343a46}.wave{fill:#ff5a4f}}
</style><rect class="bg" width="1200" height="360" rx="24"/><text x="40" y="44" font-size="22" font-weight="800" class="ink" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">How Grey makes speech</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d8322e"/></marker></defs><rect class="card" x="40" y="70" width="200" height="96" rx="16" stroke-width="1.5"/><text x="56" y="106" font-size="24" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">📝</text><text x="92" y="106" font-size="17" font-weight="700" class="ink" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">Text</text><text x="56" y="140" font-size="13" class="ink2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">any of 10 languages</text><rect class="card" x="270" y="70" width="200" height="96" rx="16" stroke-width="1.5"/><text x="286" y="106" font-size="24" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">🔤</text><text x="322" y="106" font-size="17" font-weight="700" class="ink" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">Text front-end</text><text x="286" y="140" font-size="13" class="ink2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">numbers, scripts, stress</text><rect class="card" x="500" y="70" width="200" height="96" rx="16" stroke-width="1.5"/><text x="516" y="106" font-size="24" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">🧠</text><text x="552" y="106" font-size="17" font-weight="700" class="ink" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">Text encoder</text><text x="516" y="140" font-size="13" class="ink2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">+ Swift-RM rhythm</text><rect class="card" x="730" y="70" width="200" height="96" rx="16" stroke-width="1.5"/><text x="746" y="106" font-size="24" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">🌊</text><text x="782" y="106" font-size="17" font-weight="700" class="ink" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">Flow matching</text><text x="746" y="140" font-size="13" class="ink2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">8 steps, continuous latents</text><rect class="card" x="960" y="70" width="200" height="96" rx="16" stroke-width="1.5"/><text x="976" y="106" font-size="24" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">🔊</text><text x="1012" y="106" font-size="17" font-weight="700" class="ink" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">KVAE-Audio decoder</text><text x="976" y="140" font-size="13" class="ink2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">latents → 44.1 kHz</text><rect class="card" x="500" y="230" width="200" height="96" rx="16" stroke-width="1.5"/><text x="516" y="266" font-size="24" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">🦜</text><text x="552" y="266" font-size="17" font-weight="700" class="ink" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">Voice</text><text x="516" y="300" font-size="13" class="ink2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">built-in table or a 10-30 s recording</text><rect class="card" x="730" y="230" width="200" height="96" rx="16" stroke-width="1.5"/><text x="746" y="266" font-size="24" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">🎛️</text><text x="782" y="266" font-size="17" font-weight="700" class="ink" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">Delivery labels</text><text x="746" y="300" font-size="13" class="ink2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">style, mood, speed, whisper, timing</text><rect class="card" x="960" y="230" width="200" height="96" rx="16" stroke-width="1.5"/><text x="976" y="266" font-size="24" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">🏷️</text><text x="1012" y="266" font-size="17" font-weight="700" class="ink" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">AI marking</text><text x="976" y="300" font-size="13" class="ink2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">WAV label + AudioSeal watermark</text><line x1="242" y1="118" x2="266" y2="118" class="accs" stroke-width="2.5" marker-end="url(#ar)"/><line x1="472" y1="118" x2="496" y2="118" class="accs" stroke-width="2.5" marker-end="url(#ar)"/><line x1="702" y1="118" x2="726" y2="118" class="accs" stroke-width="2.5" marker-end="url(#ar)"/><line x1="932" y1="118" x2="956" y2="118" class="accs" stroke-width="2.5" marker-end="url(#ar)"/><path d="M600 230 Q615 200 800 168" class="accs" fill="none" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/><line x1="830" y1="230" x2="830" y2="170" class="accs" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/><line x1="1060" y1="170" x2="1060" y2="226" class="accs" stroke-width="2.5" marker-end="url(#ar)"/><text x="40" y="270" font-size="14" class="ink2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"><tspan x="40" dy="0">Voice to voice: a recording goes in</tspan><tspan x="40" dy="20">instead of text, keeping its words</tspan><tspan x="40" dy="20">and timing, in another voice.</tspan></text></svg>