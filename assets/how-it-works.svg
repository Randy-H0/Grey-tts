d, speed</text><rect class="card" x="970" y="230" width="212" height="96" rx="16" stroke-width="1.5"/><text x="986" y="268" font-size="22" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">🏷️</text><text x="1020" y="267" font-size="17" font-weight="700" class="ink" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">AI marking</text><text x="986" y="302" font-size="14" class="ink2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">label + watermark</text><line x1="240" y1="118" x2="258" y2="118" class="accs" stroke-width="2.5" marker-end="url(#ar)"/><line x1="476" y1="118" x2="494" y2="118" class="accs" stroke-width="2.5" marker-end="url(#ar)"/><line x1="712" y1="118" x2="730" y2="118" class="accs" stroke-width="2.5" marker-end="url(#ar)"/><line x1="948" y1="118" x2="966" y2="118" class="accs" stroke-width="2.5" marker-end="url(#ar)"/><path d="M604 230 Q628 196 794 170" class="accs" fill="none" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/><line x1="840" y1="230" x2="840" y2="172" class="accs" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/><line x1="1076" y1="168" x2="1076" y2="226" class="accs" stroke-width="2.5" marker-end="url(#ar)"/><text font-size="14" class="ink2" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"><tspan x="26" y="262">Voice to voice: a recording</tspan><tspan x="26" dy="20">goes in instead of text, keeping</tspan><tspan x="26" dy="20">its words and timing, in</tspan><tspan x="26" dy="20">another voice.</tspan></text></svg>